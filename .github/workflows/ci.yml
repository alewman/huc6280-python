name: CI

# Kept small on purpose: one interpreter, the tests that need no fetched
# references (the corpora, MAME traces and VHDL runs skip when absent) and lint,
# on pushes to main and on pull requests. The rung runs are done by hand and
# recorded in docs/validation.md.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "pypy3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -m "not slow"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
